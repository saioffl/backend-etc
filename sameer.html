<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Busso • Future Transit 2077</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5n/N0RDwH0=" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff00ea;
      --neon-purple: #a100f2;
      --dark-bg: #0a0015;
      --card-bg: rgba(15, 5, 35, 0.72);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #0a0015, #150033, #1a004d);
      color: white;
      height: 100vh;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0,240,255,0.08) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,0,234,0.06) 0%, transparent 30%);
    }

    /* ── SPLASH ─────────────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 2000;
      background: var(--dark-bg);
      transition: opacity 1.3s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-text {
      font-size: clamp(3.8rem, 12vw, 6.2rem);
      font-weight: 900;
      letter-spacing: 0.8em;
      text-shadow: 
        0 0 20px var(--neon-cyan),
        0 0 40px var(--neon-magenta),
        0 0 80px var(--neon-purple);
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowPulse 4s infinite alternate;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 30px var(--neon-cyan); }
      50%      { text-shadow: 0 0 70px var(--neon-magenta), 0 0 120px var(--neon-purple); }
    }

    .tagline {
      margin: 20px 0 50px;
      font-size: 1.3rem;
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 4px;
      opacity: 0.85;
    }

    .launch-btn {
      padding: 18px 64px;
      font-size: 1.6rem;
      font-weight: bold;
      background: linear-gradient(45deg, var(--neon-magenta), var(--neon-cyan));
      color: #000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(0,240,255,0.65);
      transition: all 0.35s;
    }

    .launch-btn:hover {
      transform: scale(1.1) translateY(-5px);
      box-shadow: 0 0 80px var(--neon-magenta);
    }

    /* ── MAIN APP ───────────────────────────────────────────── */
    #main-app {
      height: 100vh;
      display: none;
      grid-template-rows: auto 1fr auto;
      padding: 15px;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 10px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.18), transparent);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,240,255,0.35);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 8px;
      text-shadow: 0 0 18px var(--neon-cyan);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 10px 0;
    }

    .input-group {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--neon-cyan);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(0,240,255,0.3);
    }

    input, select, button {
      background: transparent;
      border: none;
      color: white;
      padding: 14px 18px;
      font-family: 'Roboto Mono', monospace;
    }

    input, select {
      min-width: 200px;
    }

    button {
      background: linear-gradient(45deg, var(--neon-magenta), var(--neon-cyan));
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px var(--neon-magenta);
    }

    #map {
      border-radius: 16px;
      border: 2px solid rgba(0,240,255,0.45);
      box-shadow: 0 0 45px rgba(0,240,255,0.3),
                  inset 0 0 35px rgba(0,0,0,0.7);
      background: #000;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      padding: 10px 0;
    }

    .data-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0,240,255,0.35);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 22px rgba(0,0,0,0.45);
      transition: all 0.3s;
    }

    .data-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 35px rgba(0,240,255,0.35);
    }

    .data-card .value {
      font-size: 1.9rem;
      font-weight: 900;
      margin: 6px 0;
      text-shadow: 0 0 14px currentColor;
    }
    .cyan  { color: var(--neon-cyan); }
    .pink  { color: var(--neon-magenta); }
    .purple{ color: var(--neon-purple); }

    #qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      place-items: center;
      z-index: 1000;
    }

    .qr-container {
      background: rgba(20,10,50,0.92);
      padding: 32px;
      border-radius: 16px;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 70px rgba(0,240,255,0.55);
      text-align: center;
    }

    #qr-code {
      width: 240px;
      height: 240px;
      background: white;
      margin: 25px auto;
      border-radius: 12px;
      padding: 16px;
    }
  </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="logo-text">BUSSO</div>
  <div class="tagline">NEURO-TRANSIT • CHENNAI 2077</div>
  <button class="launch-btn" onclick="enterApp()">LAUNCH BUSSO</button>
</div>

<!-- MAIN APPLICATION -->
<div id="main-app">
  <header>
    <h1>BUSSO</h1>
    <div style="font-size:0.85rem; opacity:0.75; margin-top:6px;">
      Chennai • Next-Gen Transit Network
    </div>
  </header>

  <div id="map"></div>

  <div class="controls">
    <div class="input-group">
      <input type="text" id="busSearch" placeholder="Bus No / Route..." autocomplete="off"/>
    </div>
    <button id="btnTrack">TRACK</button>
    <button id="btnNearby">NEARBY</button>
    <select id="themeSwitch">
      <option value="cyber">Cyber Neon</option>
      <option value="matrix">Matrix Green</option>
      <option value="solar">Solar Punk</option>
    </select>
    <button id="btnTicket">GET TICKET</button>
  </div>

  <div class="dashboard">
    <div class="data-card cyan">
      <div>ETA</div>
      <div class="value" id="eta">--</div>
      <div>min</div>
    </div>
    <div class="data-card pink">
      <div>DISTANCE</div>
      <div class="value" id="distance">--</div>
      <div>m / km</div>
    </div>
    <div class="data-card purple">
      <div>CROWD</div>
      <div class="value" id="crowdLevel">?</div>
      <div>level</div>
    </div>
    <div class="data-card cyan">
      <div>FARE</div>
      <div class="value" id="fare">₹--</div>
    </div>
    <div class="data-card pink">
      <div>BATTERY</div>
      <div class="value" id="evBattery">---%</div>
    </div>
  </div>
</div>

<!-- QR TICKET MODAL -->
<div id="qr-modal">
  <div class="qr-container">
    <h2>BUSSO NEURAL TICKET</h2>
    <div id="qr-code"></div>
    <p style="margin:18px 0; opacity:0.85">Scan with device / neural implant</p>
    <button onclick="document.getElementById('qr-modal').style.display='none'"
            style="padding:12px 40px; background:#00f0ff; color:#000; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
      CLOSE
    </button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ──────────────────────────────────────────────────────────────
// Splash → Main transition
function enterApp() {
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('main-app').style.display = 'grid';
  }, 1300);
}

// ──────────────────────────────────────────────────────────────
// Map & Data
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView([13.0827, 80.2707], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  opacity: 0.38
}).addTo(map);

const buses = {
  "101A": { name:"101A Broadway → CMBT",        color:"#00f0ff", path:[[13.0827,80.2707],[13.092,80.285],[13.105,80.295],[13.12,80.275]],   speed:0.00013, crowd:85,  ev:true  },
  "70C":  { name:"70C Koyambedu → Besant Nagar", color:"#ff00ea", path:[[13.067,80.205],[13.075,80.22],[13.04,80.265]],               speed:0.00010, crowd:42,  ev:false },
  "27B":  { name:"27B Anna Nagar → Velachery",   color:"#a100f2", path:[[13.085,80.21],[13.09,80.23],[13.05,80.24]],                 speed:0.00012, crowd:95,  ev:true  },
  "18F":  { name:"18F Guindy → Tambaram",        color:"#00ff9d", path:[[13.01,80.22],[12.98,80.19],[12.93,80.14]],                 speed:0.00016, crowd:28,  ev:false }
};

let currentBus = null;
let busMarker = null;
let routeLine = null;
let pulseCircle = null;
let simulationInterval = null;
let userPos = null;

// Try to get user location
navigator.geolocation.getCurrentPosition(
  pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    L.marker(userPos, {
      icon: L.divIcon({
        className: 'user-blip',
        html: '<div style="width:16px;height:16px;background:#00ff41;border:2px solid #fff;border-radius:50%;box-shadow:0 0 14px #00ff41;"></div>'
      })
    }).addTo(map).bindPopup("You • Neural Link Active");
  },
  () => {},
  { enableHighAccuracy: true, timeout: 8000 }
);

// ──────────────────────────────────────────────────────────────
// Core tracking logic
function startTracking(busId) {
  if (!buses[busId]) return alert("Bus not found in 2077 network...");

  // Clean up previous
  if (simulationInterval) clearInterval(simulationInterval);
  [busMarker, routeLine, pulseCircle].forEach(l => l && map.removeLayer(l));

  currentBus = buses[busId];

  routeLine = L.polyline(currentBus.path, {
    color: currentBus.color,
    weight: 7,
    opacity: 0.7,
    dashArray: '10 14'
  }).addTo(map);

  busMarker = L.marker(currentBus.path[0], {
    icon: L.divIcon({
      className: 'bus-blip',
      html: `<div style="background:${currentBus.color};width:26px;height:26px;border-radius:50%;box-shadow:0 0 24px ${currentBus.color}, inset 0 0 9px #000;"></div>`
    })
  }).addTo(map);

  pulseCircle = L.circle(currentBus.path[0], {
    radius: 90,
    color: currentBus.color,
    fillColor: currentBus.color,
    fillOpacity: 0.16,
    weight: 2
  }).addTo(map);

  let step = 0;
  let direction = 1;

  simulationInterval = setInterval(() => {
    step += direction * currentBus.speed;
    if (step >= currentBus.path.length-1 || step <= 0) direction *= -1;

    const pos = interpolatePath(currentBus.path, Math.abs(step));

    busMarker.setLatLng(pos);
    pulseCircle.setLatLng(pos);

    if (userPos) {
      const dist = map.distance(userPos, pos) | 0;
      document.getElementById('distance').textContent = 
        dist < 1000 ? dist + " m" : (dist/1000).toFixed(1) + " km";
      const eta = Math.round(dist / 480); // rough ~25-30 km/h avg
      document.getElementById('eta').textContent = eta <= 0 ? "<1" : eta;
    }

    document.getElementById('crowdLevel').textContent = 
      currentBus.crowd > 80 ? "CRUSH" : currentBus.crowd > 50 ? "BUSY" : "OK";

    document.getElementById('evBattery').textContent = 
      currentBus.ev ? (72 + Math.floor(Math.random()*24)) + "%" : "—";

    document.getElementById('fare').textContent = 
      "₹" + Math.round(14 + (currentBus.crowd / 12) * 4);
  }, 1000);
}

function interpolatePath(path, index) {
  const i = Math.floor(index);
  const frac = index - i;
  if (i >= path.length - 1) return path[path.length - 1];
  const p1 = path[i];
  const p2 = path[i + 1];
  return [
    p1[0] + (p2[0] - p1[0]) * frac,
    p1[1] + (p2[1] - p1[1]) * frac
  ];
}

// ──────────────────────────────────────────────────────────────
// Event Listeners
document.getElementById('btnTrack').onclick = () => {
  const q = document.getElementById('busSearch').value.trim().toUpperCase();
  startTracking(q);
};

document.getElementById('btnNearby').onclick = () => {
  if (!userPos) return alert("Location permission required for nearby search");
  
  let closest = null;
  let minDist = Infinity;

  for (const [id, bus] of Object.entries(buses)) {
    const dist = Math.min(...bus.path.map(p => map.distance(userPos, p)));
    if (dist < minDist) {
      minDist = dist;
      closest = id;
    }
  }

  if (closest && minDist < 6000) {
    document.getElementById('busSearch').value = closest;
    startTracking(closest);
  } else {
    alert("No active buses within ~6km range...");
  }
};

document.getElementById('btnTicket').onclick = () => {
  if (!currentBus) return alert("Please track a bus first!");

  const modal = document.getElementById('qr-modal');
  modal.style.display = 'grid';

  document.getElementById('qr-code').innerHTML = "";
  new QRCode(document.getElementById('qr-code'), {
    text: `BUSSO|TICKET|${currentBus.name}|${new Date().toISOString().slice(0,19)}|SINGLE|R${Math.floor(Math.random()*900+100)}`,
    width: 200,
    height: 200,
    colorDark: "#000000",
    colorLight: "#ffffff"
  });
};

// Theme switcher
document.getElementById('themeSwitch').onchange = e => {
  const t = e.target.value;
  document.documentElement.style.setProperty('--neon-cyan',   t==='matrix'?'#00ff41':t==='solar'?'#ffea00':'#00f0ff');
  document.documentElement.style.setProperty('--neon-magenta',t==='solar'?'#ff6a00':'#ff00ea');
};

// Enter key support
document.getElementById('busSearch').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('btnTrack').click();
});
</script>
</body>
</html>
